<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — My_LLM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --bg2: #161b22; --bg3: #1c2333;
      --border: #30363d; --text: #e6edf3; --muted: #8b949e;
      --accent: #f59e0b; --accent-h: #d97706;
      --danger: #f85149; --success: #3fb950;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(245,158,11,0.07) 0%, transparent 60%), var(--bg);
    }
    .card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
      padding: 2.5rem 2rem; width: 100%; max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6); position: relative; overflow: hidden;
    }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background: linear-gradient(90deg, var(--accent), #ef4444, var(--accent)); }
    .logo { display:flex; align-items:center; gap:.6rem; margin-bottom:1.75rem; }
    .logo-icon { width:38px; height:38px; background:linear-gradient(135deg,var(--accent),#ef4444);
      border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
    .logo-text { font-size:1.2rem; font-weight:700; color:var(--accent); }
    .logo-badge { font-size:.65rem; font-weight:700; background:rgba(245,158,11,.15);
      border:1px solid rgba(245,158,11,.3); color:var(--accent); padding:.15rem .5rem;
      border-radius:100px; text-transform:uppercase; letter-spacing:.06em; }
    h1 { font-size:1.4rem; font-weight:700; margin-bottom:.3rem; }
    p.sub { color:var(--muted); font-size:.875rem; margin-bottom:1.75rem; }
    .group { margin-bottom:1rem; }
    label { display:block; font-size:.78rem; font-weight:600; color:var(--muted);
      text-transform:uppercase; letter-spacing:.04em; margin-bottom:.4rem; }
    input { width:100%; background:var(--bg3); border:1px solid var(--border);
      border-radius:10px; padding:.7rem .9rem; color:var(--text); font-size:.95rem;
      font-family:'Inter',sans-serif; outline:none; transition:border-color .2s, box-shadow .2s; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(245,158,11,.12); }
    .btn { width:100%; background:linear-gradient(135deg,var(--accent),var(--accent-h));
      color:#000; font-weight:700; font-size:.95rem; border:none; border-radius:10px;
      padding:.78rem; cursor:pointer; margin-top:.5rem; font-family:'Inter',sans-serif;
      transition:all .2s; box-shadow:0 2px 8px rgba(245,158,11,.3); }
    .btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 20px rgba(245,158,11,.4); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .alert { border-radius:10px; padding:.7rem 1rem; font-size:.875rem;
      margin-bottom:1rem; display:none; }
    .alert.visible { display:flex; align-items:center; gap:.5rem; }
    .alert-error { background:rgba(248,81,73,.1); border:1px solid rgba(248,81,73,.3); color:#ff7b72; }
    .spinner { width:16px; height:16px; border:2px solid transparent; border-top-color:currentColor;
      border-radius:50%; animation:spin .65s linear infinite; display:none; flex-shrink:0; }
    .spinner.visible { display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .warning { background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.2);
      border-radius:10px; padding:.75rem 1rem; font-size:.8rem; color:#fcd34d;
      margin-bottom:1.5rem; display:flex; gap:.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <span class="logo-text">My_LLM</span>
      <span class="logo-badge">Admin</span>
    </div>

    <h1>Admin Access</h1>
    <p class="sub">Restricted area — authorized personnel only</p>

    <div class="warning">
      ⚠️ This page is for administrators only. Unauthorized access attempts are logged.
    </div>

    <div id="alertMsg" class="alert alert-error"></div>

    <form id="adminLoginForm">
      <div class="group">
        <label for="email">Admin Email</label>
        <input id="email" type="email" placeholder="admin@example.com" autocomplete="off" required />
      </div>
      <div class="group">
        <label for="password">Admin Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="off" required />
      </div>
      <button type="submit" id="submitBtn" class="btn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Access Admin Panel</span>
      </button>
    </form>
  </div>

  <script>
    const API_BASE = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
      ? "http://127.0.0.1:8000"
      : "https://ai-llm-tcsk.onrender.com";

    // Redirect if already logged in
    if (localStorage.getItem("admin_token")) {
      window.location.href = "index.html";
    }

    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById("alertMsg");
      const spinner = document.getElementById("spinner");
      const btn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");

      alertEl.className = "alert";
      btn.disabled = true;
      spinner.classList.add("visible");
      btnText.textContent = "Verifying…";

      try {
        const res = await fetch(`${API_BASE}/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Access denied");
        localStorage.setItem("admin_token", data.access_token);
        window.location.href = "index.html";
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.className = "alert alert-error visible";
      } finally {
        btn.disabled = false;
        spinner.classList.remove("visible");
        btnText.textContent = "Access Admin Panel";
      }
    });
  </script>
</body>
</html>
