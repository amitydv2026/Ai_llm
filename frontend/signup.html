<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — My_LLM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">🤖</div>
      <span class="auth-logo-text">My_LLM</span>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Start generating AI content for free</p>

    <!-- Alert -->
    <div id="alertMsg" class="alert" role="alert"></div>

    <!-- Form -->
    <form id="signupForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="name">Full name</label>
        <input
          id="name"
          name="name"
          type="text"
          class="form-input"
          placeholder="Jane Doe"
          autocomplete="name"
          required
        />
        <div id="nameError" class="field-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-input"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
        <div id="emailError" class="field-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          placeholder="Min. 8 characters"
          autocomplete="new-password"
          required
        />
        <div id="passwordError" class="field-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          class="form-input"
          placeholder="Re-enter your password"
          autocomplete="new-password"
          required
        />
        <div id="confirmPasswordError" class="field-error"></div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 0.5rem;">
        <span class="spinner" id="spinner"></span>
        <span class="btn-text">Create Account</span>
      </button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>initSignupPage();</script>
</body>
</html>
